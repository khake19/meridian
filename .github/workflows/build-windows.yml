name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/transcription/requirements-whisperx.txt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r services/transcription/requirements-whisperx.txt pyinstaller==6.21.0

      - name: Type-check renderer
        run: pnpm nx typecheck desktop-renderer

      - name: Run desktop tests
        env:
          MERIDIAN_PYTHON: ${{ github.workspace }}\.venv\Scripts\python.exe
        run: pnpm nx test desktop

      - name: Build Windows installer
        run: pnpm nx run desktop:package-windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Meridian-windows-x64
          path: release/*-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
